  <meta charset="UTF-8">

  <style>
    :root {
      --fons: #f4f6f8;
      --text: #17202a;
      --blau: #175cd3;
      --verd: #16794b;
      --vermell: #b42318;
      --vora: #c8d0d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fons);
      color: var(--text);
      text-align: center;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 10px; }
    .instruccions { font-size: 1.15rem; margin: 0 auto 24px; max-width: 720px; line-height: 1.5; }
    .targetes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .targeta-contenidor { perspective: 1000px; }
    .targeta {
      position: relative;
      width: 100%;
      min-height: 360px;
      border: 3px solid var(--vora);
      border-radius: 18px;
      background: white;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.55s;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .targeta.girada { transform: rotateY(180deg); }
    .cara {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 15px;
    }
    .davant { background: #fff; }
    .darrere { transform: rotateY(180deg); background: #fff; }
    .animal {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 12px;
      background: #eef2f6;
    }
    .nom-animal { font-size: 1.4rem; font-weight: bold; }
    .pista { font-size: 1rem; color: #475467; }
    .sillabes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
    }
    .sil·laba {
      border: 2px solid #98a2b3;
      border-radius: 10px;
      background: #f8fafc;
      padding: 12px 15px;
      min-width: 58px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      color: var(--text);
    }
    .sil·laba:focus-visible, button:focus-visible, .targeta:focus-visible {
      outline: 4px solid #fdb022;
      outline-offset: 3px;
    }
    .sil·laba.seleccionada { background: #dbeafe; border-color: var(--blau); }
    .resposta {
      min-height: 44px;
      width: 100%;
      padding: 10px;
      border: 2px dashed #98a2b3;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .botons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button.accio {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .corregir { background: var(--blau); color: white; }
    .esborrar { background: #e4e7ec; color: #17202a; }
    .missatge { min-height: 28px; font-size: 1.05rem; font-weight: bold; }
    .correcte { color: var(--verd); }
    .incorrecte { color: var(--vermell); }
    .nota { margin-top: 22px; color: #475467; font-size: .95rem; }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .targeta { min-height: 340px; }
      .animal { height: 185px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .targeta { transition: none; }
    }
  </style>

    // Barreja les síl·labes sense modificar l'ordre correcte original.
    function barreja(llista) {
      const copia = [...llista];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      // Si casualment queda igual i hi ha més d'una síl·laba, la canviem de lloc.
      if (copia.length > 1 && copia.every((s, i) => s === llista[i])) {
        copia.push(copia.shift());
      }
      return copia;
    }

    const contenidor = document.getElementById("targetes");

    animals.forEach((animal, index) => {
      const correcte = animal.sillabes.join("");
      const desordenades = barreja(animal.sillabes);
      const envoltori = document.createElement("section");
      envoltori.className = "targeta-contenidor";
      envoltori.innerHTML = `
        <div class="targeta" tabindex="0" role="button" aria-label="Gira la targeta de l'animal ${animal.alt}" aria-pressed="false">
          <div class="cara davant">
            <img class="animal" src="${animal.imatge}" alt="${animal.alt}" loading="lazy"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display:none;font-size:6rem" aria-hidden="true">🐾</div>
            <div class="nom-animal">QUIN ANIMAL ÉS?</div>
            <div class="pista">Prem la targeta per girar-la</div>
          </div>
          <div class="cara darrere">
            <div class="nom-animal">ORDENA LES SÍL·LABES</div>
            <div class="sillabes" aria-label="Síl·labes disponibles"></div>
            <div class="resposta" aria-live="polite" aria-label="La teva resposta"></div>
            <div class="botons">
              <button class="accio corregir" type="button">CORREGIR</button>
              <button class="accio esborrar" type="button">TORNAR A COMENÇAR</button>
            </div>
            <div class="missatge" aria-live="polite"></div>
          </div>
        </div>`;

      const targeta = envoltori.querySelector(".targeta");
      const zonaSillabes = envoltori.querySelector(".sillabes");
      const resposta = envoltori.querySelector(".resposta");
      const missatge = envoltori.querySelector(".missatge");
      let triades = [];

      function actualitzaResposta() {
        resposta.textContent = triades.map(s => s.text).join(" · ");
      }

      function pintaSillabes() {
        zonaSillabes.innerHTML = "";
        desordenades.forEach((sillaba, i) => {
          const boto = document.createElement("button");
          boto.type = "button";
          boto.className = "sil·laba";
          boto.textContent = sillaba;
          boto.setAttribute("aria-label", "Síl·laba " + sillaba);
          boto.addEventListener("click", (event) => {
            event.stopPropagation();
            if (boto.disabled) return;
            triades.push({ text: sillaba, id: i });
            boto.disabled = true;
            boto.classList.add("seleccionada");
            actualitzaResposta();
            missatge.textContent = "";
            missatge.className = "missatge";
          });
          zonaSillabes.appendChild(boto);
        });
      }

      function reinicia() {
        triades = [];
        actualitzaResposta();
        missatge.textContent = "";
        missatge.className = "missatge";
        pintaSillabes();
      }

      targeta.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        targeta.classList.toggle("girada");
        targeta.setAttribute("aria-pressed", targeta.classList.contains("girada") ? "true" : "false");
      });
      targeta.addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button")) {
          event.preventDefault();
          targeta.classList.toggle("girada");
          targeta.setAttribute("aria-pressed", targeta.classList.contains("girada") ? "true" : "false");
        }
      });

      envoltori.querySelector(".corregir").addEventListener("click", (event) => {
        event.stopPropagation();
        const respostaUsuari = triades.map(s => s.text).join("");
        if (respostaUsuari === correcte) {
          missatge.textContent = "MOLT BÉ! RESPOSTA CORRECTA!";
          missatge.className = "missatge correcte";
        } else {
          missatge.textContent = "ENCARA NO. TORNA-HO A PROVAR!";
          missatge.className = "missatge incorrecte";
        }
      });

      envoltori.querySelector(".esborrar").addEventListener("click", (event) => {
        event.stopPropagation();
        reinicia();
      });

      pintaSillabes();
      contenidor.appendChild(envoltori);
    });
  </script>
</body>
